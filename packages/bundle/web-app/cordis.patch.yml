# The dsh-web-app surface patch over dsh-base + dsh-gui-app. This layer owns
# only browser startup, HTTP serving, Web runtime glue, development client HMR,
# Web connection trust, and the bind-dependent directory interaction.
#
# The web-startup plugin injects `cmdlineArgs` and provides `webStartup` as an
# ordinary Cordis service. Rows configured from flags inject that service, so
# Loader resolves their expressions only after it exists. The web runtime then
# provides bind-dependent `webRuntime` values to the connection trust fence.
# `dsh --profile web --help` provides neither service, so no server binds.

- insert:
    - id: web-startup
      name: '@deepseek-ai/dsh-web-app/startup'

    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      inject: [webStartup]
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 3080

    - id: web-runtime
      name: '@deepseek-ai/dsh-web-app'
      inject: [webStartup]
      config:
        printUrl: true
        surfaceContext: true
        trustedHosts: !!js ctx.webStartup.trustedHosts

    # The rebuild watcher is external (`pnpm run dev:web`); this row receives
    # changed graphs and bundles when that watcher is active.
    - id: client-hmr
      name: '@deepseek-ai/dsh-client-hmr'

    # Resolve bind host, SSH launch, and display once, then mount the matching
    # Host backend and client directory surface as Loader entries.
    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-auto'

# The shared GUI layer owns the connection roster row. Web adds the runtime
# ordering dependency and trust values required by its HTTP/WebSocket carrier.
- id: connection
  inject: [webRuntime]
  config:
    trustedHosts: !!js ctx.webRuntime.trustedHosts
